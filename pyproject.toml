[project]
name = "prueba-tecnica-johand-castro"
version = "0.1.0"
description = "Sistema de seguimiento de prácticas profesionales"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
prueba-tecnica-johand-castro = "prueba_tecnica_johand_castro:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
